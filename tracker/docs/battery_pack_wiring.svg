<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="8.5in" viewBox="0 0 1100 850" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <style>
      .t { font-size: 13px; fill: #111; }
      .s { font-size: 11px; fill: #444; }
      .b { font-weight: bold; }
      .h { font-size: 15px; font-weight: bold; fill: #111; }
      .pos { stroke: #d01818; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .neg { stroke: #111; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .mid { stroke: #e07b00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thick { stroke-width: 6; }
      .thin { stroke-width: 2.2; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.6; }
      .later { fill: #f4f4f4; stroke: #999; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .pad { fill: #c9a227; stroke: #6b5400; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1100" height="850" fill="#fff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#111">Open Duck Mini v2: battery pack wiring</text>
  <text x="40" y="64" class="t">For your parts: 2× 18650 holder · 2S 20 A balanced BMS (pads 0V / 4.2V / 8.4V / − / +) · Adeept 2S USB-C charger · XT30</text>
  <text x="40" y="82" class="s">Pads are drawn on the edges you described. Their order along each edge may differ on your board, so go by the printed labels, not by position.</text>

  <!-- ===== Midpoint (balance) wire: bridge -> 4.2V ===== -->
  <path class="mid thin" d="M58 196 V128 H650 V196 H612"/>
  <text x="250" y="121" class="t"><tspan class="b" fill="#e07b00">Midpoint wire</tspan>: bridge → <tspan class="b">4.2V</tspan> pad. Existing 26 AWG is fine (it carries only mA).</text>

  <!-- ===== Cell holder ===== -->
  <text x="50" y="163" class="h">2× 18650 holder</text>
  <rect x="50" y="172" width="240" height="166" rx="8" class="box"/>
  <rect x="52" y="190" width="12" height="130" fill="#9a9a9a" stroke="#555"/>
  <rect x="72" y="192" width="196" height="52" rx="10" fill="#e8f0fb" stroke="#3b6fc4"/>
  <text x="170" y="223" class="t b" text-anchor="middle">CELL 1</text>
  <text x="82" y="224" class="t b" fill="#d01818">+</text>
  <text x="256" y="224" class="t b">−</text>
  <rect x="72" y="266" width="196" height="52" rx="10" fill="#e8f0fb" stroke="#3b6fc4"/>
  <text x="170" y="297" class="t b" text-anchor="middle">CELL 2</text>
  <text x="82" y="298" class="t b">−</text>
  <text x="254" y="298" class="t b" fill="#d01818">+</text>
  <text x="50" y="356" class="s">Grey strip = metal bridge at the far end (joins</text>
  <text x="50" y="370" class="s">CELL 1 + to CELL 2 −). That is the midpoint.</text>
  <text x="50" y="388" class="s b">Solder only with the cells OUT of the holder.</text>

  <!-- holder -> BMS main leads -->
  <path class="neg thick" d="M268 218 H430"/>
  <path class="pos thick" d="M268 292 H430"/>
  <text x="300" y="208" class="t">pack −</text>
  <text x="300" y="282" class="t" fill="#d01818">pack +</text>
  <text x="298" y="240" class="s">22 AWG, short.</text>
  <text x="298" y="254" class="s">Replace the thin</text>
  <text x="298" y="268" class="s">26 AWG leads.</text>

  <!-- ===== BMS ===== -->
  <text x="430" y="163" class="h">BMS 2S 20 A (balanced)</text>
  <rect x="430" y="172" width="182" height="166" rx="6" fill="#eef6ee" stroke="#2f8f5b" stroke-width="1.8"/>
  <!-- left pads -->
  <rect x="424" y="210" width="14" height="16" class="pad"/>
  <rect x="424" y="284" width="14" height="16" class="pad"/>
  <text x="444" y="222" class="t b">0V</text><text x="470" y="222" class="s">(B−)</text>
  <text x="444" y="296" class="t b">8.4V</text><text x="482" y="296" class="s">(B+)</text>
  <!-- right pads -->
  <rect x="604" y="188" width="14" height="16" class="pad"/>
  <rect x="604" y="237" width="14" height="16" class="pad"/>
  <rect x="604" y="297" width="14" height="16" class="pad"/>
  <text x="598" y="200" class="t b" text-anchor="end">4.2V</text><text x="558" y="200" class="s" text-anchor="end">(B1)</text>
  <text x="598" y="249" class="t b" text-anchor="end">−</text>
  <text x="598" y="309" class="t b" text-anchor="end" fill="#d01818">+</text>
  <!-- inside: protection switch on the negative side, + joined to 8.4V -->
  <path d="M470 226 V236 H506" stroke="#2f8f5b" stroke-width="1.4" fill="none"/>
  <path d="M506 236 L524 226" stroke="#2f8f5b" stroke-width="1.6" fill="none"/>
  <path d="M528 236 H545 V245 H588" stroke="#2f8f5b" stroke-width="1.4" fill="none"/>
  <text x="488" y="262" class="s" fill="#2f8f5b">protection switches</text>
  <path d="M510 300 Q560 300 560 305 H586" stroke="#2f8f5b" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <text x="500" y="320" class="s" fill="#2f8f5b">+ is joined to</text><text x="500" y="333" class="s" fill="#2f8f5b">8.4V on the board</text>

  <!-- ===== Output lines BMS -> XT30 ===== -->
  <path class="neg thick" d="M612 245 H860"/>
  <path class="neg thick" d="M910 245 H950"/>
  <path class="pos thick" d="M612 305 H950"/>
  <text x="630" y="236" class="t">output − <tspan class="s">(P−)</tspan></text>
  <text x="630" y="296" class="t" fill="#d01818">output + <tspan class="s">(P+)</tspan></text>
  <text x="812" y="330" class="s">22 AWG to the XT30</text>

  <!-- future power switch on the negative line (as in the official diagram) -->
  <path class="neg thick" d="M860 245 H868"/>
  <path class="neg thick" d="M902 245 H910"/>
  <circle cx="870" cy="245" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="900" cy="245" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M872 243 L898 228" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="885" y="268" class="s b" text-anchor="middle">SWITCH</text>
  <text x="836" y="160" class="s b">Power switch: 14 A toggle</text>
  <text x="836" y="174" class="s">On the − line, after the charger tap,</text>
  <text x="836" y="188" class="s">so the pack still charges when it is off.</text>

  <!-- charger taps: on the BMS side of the switch, so it charges with the switch off -->
  <circle cx="740" cy="305" r="5" fill="#d01818"/>
  <circle cx="800" cy="245" r="5" fill="#111"/>
  <path class="pos thin" d="M740 305 V420"/>
  <path class="neg thin" d="M800 420 V313 A8 8 0 0 0 800 297 V245"/>
  <rect x="690" y="420" width="170" height="70" rx="6" class="box"/>
  <text x="775" y="444" class="t b" text-anchor="middle">USB-C charger</text>
  <text x="775" y="461" class="s" text-anchor="middle">Adeept 2S, needs 5 V 2 A in</text>
  <text x="775" y="477" class="s" text-anchor="middle">charges at about 1.1 A</text>
  <text x="746" y="414" class="s" fill="#d01818">OUT+</text>
  <text x="806" y="414" class="s">OUT−</text>
  <text x="870" y="440" class="s">26 AWG is fine</text>
  <text x="870" y="454" class="s">(only about 1.1 A)</text>

  <!-- XT30 female, battery side -->
  <rect x="950" y="222" width="46" height="106" rx="6" fill="#f2c500" stroke="#7a6300" stroke-width="1.6"/>
  <text x="973" y="252" class="t b" text-anchor="middle">−</text>
  <text x="973" y="312" class="t b" text-anchor="middle" fill="#d01818">+</text>
  <text x="944" y="350" class="t b">XT30</text>
  <text x="944" y="366" class="s">FEMALE on the</text>
  <text x="944" y="380" class="s">battery side</text>
  <text x="944" y="394" class="s">(recessed contacts)</text>

  <!-- ===== Legend ===== -->
  <text x="40" y="438" class="h">Wire key</text>
  <path class="pos thick" d="M40 462 H100"/><path class="neg thick" d="M40 482 H100"/>
  <text x="112" y="477" class="t">Thick: <tspan class="b">22 AWG silicone</tspan>, main current path (up to about 5 A peaks)</text>
  <path class="pos thin" d="M40 506 H100"/><path class="neg thin" d="M40 520 H100"/>
  <text x="112" y="517" class="t">Thin: 26 AWG is fine (charger, midpoint)</text>
  <text x="40" y="546" class="t">Red = positive · Black = negative · <tspan fill="#e07b00" class="b">Orange</tspan> = midpoint (balance)</text>

  <!-- ===== Checklist ===== -->
  <rect x="30" y="566" width="520" height="278" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="44" y="590" class="h">Before the cells go in (meter on Ω / continuity)</text>
  <text x="48" y="612" class="t">☐  <tspan class="b">+</tspan> to <tspan class="b">8.4V</tspan>: about 0 Ω (same copper)</text>
  <text x="48" y="631" class="t">☐  <tspan class="b">−</tspan> to <tspan class="b">0V</tspan>: <tspan class="b">NOT</tspan> 0 Ω (protection switches in between)</text>
  <text x="48" y="650" class="t">☐  4.2V to 0V and 4.2V to 8.4V: not shorted</text>
  <text x="48" y="669" class="t">☐  Load and charger negative go to <tspan class="b">−</tspan>, never to 0V</text>
  <text x="44" y="698" class="h">After the cells go in (DC volts). Yours: 3.720 / 3.721 V</text>
  <text x="48" y="720" class="t">☐  0V→4.2V ≈ 3.72 V  ·  4.2V→8.4V ≈ 3.72 V  ·  0V→8.4V ≈ 7.44 V</text>
  <text x="48" y="739" class="t">☐  − to + ≈ 7.44 V. Reads 0 V? Plug in the charger for a few</text>
  <text x="66" y="756" class="t">seconds to wake the BMS.</text>
  <text x="48" y="777" class="t">☐  First charge: watch it, never leave it unattended. It stops at</text>
  <text x="66" y="794" class="t">about 8.4 V, halves within 0.05 V, cells stay cool.</text>
  <text x="48" y="815" class="t">☐  <tspan class="b">Don't charge to full yet:</tspan> the servos' limit is 8.0 V.</text>
  <text x="66" y="832" class="t">Use the pack as it is (7.44 V) for the first tests.</text>

  <!-- ===== Robot side ===== -->
  <rect x="570" y="566" width="500" height="278" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="584" y="590" class="h">Robot side: XT30 to servo adapter and UBEC</text>
  <rect x="590" y="640" width="38" height="80" rx="5" fill="#f2c500" stroke="#7a6300"/>
  <text x="609" y="666" class="t b" text-anchor="middle">−</text>
  <text x="609" y="706" class="t b" text-anchor="middle" fill="#d01818">+</text>
  <text x="584" y="740" class="s">XT30 male</text>
  <path class="neg thick" d="M628 660 H700 V650 H790"/>
  <path class="pos thick" d="M628 700 H700 V690 H790"/>
    <path class="neg thin" d="M680 660 V692 A8 8 0 0 1 680 708 V770 H790"/>
  <path class="pos thin" d="M660 700 V790 H790"/>
  <circle cx="680" cy="660" r="4" fill="#111"/>
  <circle cx="660" cy="700" r="4" fill="#d01818"/>
  <rect x="790" y="630" width="270" height="80" rx="6" class="box"/>
  <text x="802" y="652" class="t b">Servo adapter screw terminals</text>
  <text x="802" y="670" class="t">match <tspan class="b" fill="#d01818">+</tspan> / <tspan class="b">−</tspan> to the printed labels</text>
  <text x="802" y="688" class="t">22 AWG, ferrules (not tinned)</text>
  <text x="802" y="704" class="s">No barrel plug. Re-tighten after first runs.</text>
  <rect x="790" y="752" width="270" height="62" rx="6" class="box"/>
  <text x="802" y="774" class="t b">UBEC IN → 5 V OUT → Pi 5 V</text>
  <text x="802" y="792" class="t">Set the jumper to <tspan class="b">5.0 V</tspan> and meter the</text>
  <text x="802" y="808" class="t">output BEFORE connecting the Pi.</text>
  <text x="584" y="614" class="s">Splits two ways: servo adapter (heavy current) and UBEC (under 1 A).</text>
</svg>
