<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header class="dash-head">
  <div class="title">
    <h1>Duck Dashboard</h1>
    <span id="hstatus" class="muted small">connecting…</span>
  </div>
  <nav id="tabs" class="tabs" aria-label="Sections">
    <a href="#progress">Progress</a>
    <a href="#animations">Animations</a>
    <a href="#training">Training</a>
    <a href="#skills">Skills</a>
    <a href="#tools">Tools</a>
    <a href="#telemetry">Telemetry</a>
    <a href="#experiments">Experiments</a>
    <a href="#puppet">Puppet</a>
  </nav>
</header>

<main id="main">
  <section id="tab-progress" class="tab"><p class="muted">Loading…</p></section>

  <section id="tab-animations" class="tab">
    <div id="anim-list"></div>
    <div id="anim-detail" hidden>
      <div class="detail-head">
        <a href="#animations" class="back">‹ All clips</a>
        <h2 id="anim-title" class="mono"></h2>
        <span id="anim-badge"></span>
      </div>
      <div class="anim-grid">
        <div class="viewer card pad0">
          <div class="toolbar">
            <button id="anim-play" class="ghost" title="space">▶</button>
            <span id="anim-time" class="mono small">0.00 / 0.00 s</span>
            <label class="check small"><input type="checkbox" id="anim-loop" checked> loop</label>
            <label class="small">speed <input type="number" id="anim-speed" value="1" min="0.1" max="3" step="0.1"></label>
            <span class="sep"></span>
            <button id="anim-reset" class="ghost small">Reset view</button>
          </div>
          <div id="anim-canvas" class="canvas-wrap"><div id="anim-loading" class="loading">Loading model…</div></div>
          <input type="range" id="anim-scrub" min="0" max="1000" value="0" class="scrub" aria-label="scrub">
        </div>
        <div id="anim-info" class="stack"></div>
      </div>
    </div>
  </section>

  <section id="tab-training" class="tab">
    <div id="training-main"><p class="muted">Loading…</p></div>
    <div id="run-page" hidden></div>
  </section>

  <section id="tab-skills" class="tab">
    <div id="skills-main"><p class="muted">Loading…</p></div>
    <div id="skill-page" hidden></div>
  </section>

  <section id="tab-tools" class="tab">
    <div id="tools-main"><p class="muted">Loading…</p></div>
    <div id="job-page" hidden></div>
  </section>

  <section id="tab-telemetry" class="tab"><p class="muted">Loading…</p></section>
  <section id="tab-experiments" class="tab"><p class="muted">Loading…</p></section>
  <section id="tab-puppet" class="tab"><p class="muted">Loading…</p></section>
</main>
<div id="toast" hidden></div>

<script type="module" src="dash.js"></script>
</body>
</html>
